<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flag Tree</title>
<!--
  Template: flag-tree.html · v2026-04-27 (Shipmate / visual-explainer)
  Feature flag dependency trees — Armada palette on light gray surfaces.
  - Data: JSON in <script type="application/json" id="flag-data"> — replace default `{}` with the Flag Tree Data Object
  - Sticky header, KPI cards, D3 SVG diagram, summary table, observations
  - Test-only prereqs: dashed indigo; prod-only children: dashed green
  - Theme via [data-theme=dark]; resize debounced for diagram rebuild

  Payload must be valid JSON (Flag Tree Data Object from feature-flag-visualizer Step 4.7).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8F9FA;--surface:#fff;--surface2:#F1F3F5;--border:#DEE2E6;--text:#212529;--text2:#6C757D;--text3:#ADB5BD;--amber:#F59E0B;--amber-dark:#D97706;--amber-light:#FEF3C7;--blue:#3B82F6;--blue-dark:#2563EB;--blue-light:#DBEAFE;--indigo:#6366F1;--indigo-light:#EEF2FF;--green:#10B981;--green-dark:#059669;--green-light:#D1FAE5;--red:#EF4444;--orange:#F97316;--shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);--shadow-md:0 4px 6px -1px rgba(0,0,0,.10),0 2px 4px -1px rgba(0,0,0,.06);--radius:8px;--mono:'Atkinson Hyperlegible Mono','Courier New',monospace;--sans:'Inter',system-ui,sans-serif}
[data-theme=dark]{--bg:#0F1117;--surface:#1A1D27;--surface2:#232637;--border:#2E3347;--text:#E2E8F0;--text2:#94A3B8;--text3:#475569;--amber-light:#451A03;--blue-light:#1E3A5F;--indigo-light:#1E1B4B;--green-light:#022C22;--shadow:0 1px 3px rgba(0,0,0,.3);--shadow-md:0 4px 6px -1px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;transition:background .2s,color .2s}
.header{position:sticky;top:0;z-index:100;background:var(--surface);border-bottom:1px solid var(--border);box-shadow:var(--shadow);padding:12px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.header-key{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--text)}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;font-family:var(--mono)}
.badge-team{background:var(--blue-light);color:var(--blue-dark)}
.badge-tag{background:var(--surface2);color:var(--text2)}
.header-spacer{flex:1}
.btn{padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;font-family:var(--sans)}
.btn:hover{background:var(--surface2)}
.main{max-width:1400px;margin:0 auto;padding:24px}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:28px}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.kpi-label{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.kpi-value{font-size:28px;font-weight:700;color:var(--text);font-family:var(--mono)}
.kpi-value.warn{color:var(--red)}
.section{margin-bottom:28px}
.section-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);margin-bottom:14px}
.diagram-container{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:28px;overflow:hidden}
.diagram-toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.diagram-title{font-size:13px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;flex:1}
#diagram-svg-wrapper{overflow:hidden;border-radius:6px;background:var(--surface2)}
#diagram-svg{display:block}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2)}
.legend-rect{width:16px;height:12px;border-radius:3px}
.legend-circle{width:14px;height:14px;border-radius:50%}
.table-wrapper{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:12px}
thead{background:var(--surface2)}
th{padding:10px 12px;text-align:left;font-weight:600;color:var(--text2);font-size:11px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--border)}
td{padding:9px 12px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface2)}
.table-key{font-family:var(--mono);font-size:11px;font-weight:600}
.pill{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:600}
.pill-root{background:var(--amber-light);color:var(--amber-dark)}
.pill-parent{background:var(--blue-light);color:var(--blue-dark)}
.pill-test-only{background:var(--indigo-light);color:var(--indigo)}
.pill-child{background:var(--green-light);color:var(--green-dark)}
.pill-grandchild{background:#D1FAE5;color:#065F46}
.obs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.obs-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.obs-card-title{font-size:12px;font-weight:700;color:var(--text);margin-bottom:8px}
.obs-card ul{list-style:none}
.obs-card li{font-size:12px;color:var(--text2);padding:3px 0;border-bottom:1px solid var(--border)}
.obs-card li:last-child{border-bottom:none}
.key-ref{font-family:var(--mono);font-size:10px;color:var(--blue)}
.footer{text-align:center;padding:24px;font-size:11px;color:var(--text3);font-family:var(--mono)}
.footer a{color:var(--text3)}
code{font-family:var(--mono);font-size:10px;background:var(--surface2);padding:1px 4px;border-radius:3px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:768px){.main{padding:12px}.stats-row{grid-template-columns:repeat(3,1fr)}}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.pill-grandparent{background:#F5F3FF;color:#4C1D95}
[data-theme=dark] .pill-grandparent{background:#2E1065;color:#DDD6FE}
</style>
</head>
<body>
<header class="header">
  <span class="header-key" id="hdr-key"></span>
  <div class="badges" id="hdr-badges"></div>
  <div class="header-spacer"></div>
  <button type="button" class="btn" id="theme-btn" aria-label="Toggle color theme" onclick="toggleTheme()">🌙</button>
</header>

<main class="main">

<div class="stats-row" id="stats-row"></div>

<div class="section">
  <div class="diagram-container">
    <div class="diagram-toolbar">
      <span class="diagram-title">Dependency Tree Diagram</span>
      <button type="button" class="btn" onclick="zoomIn()">＋</button>
      <button type="button" class="btn" onclick="zoomOut()">－</button>
      <button type="button" class="btn" onclick="resetZoom()">Reset</button>
    </div>
    <div id="diagram-svg-wrapper"><svg id="diagram-svg" role="img" aria-label="Feature flag dependency tree diagram"></svg></div>
    <div class="legend" id="diagram-legend"></div>
  </div>
</div>

<div class="section">
  <div class="section-title">All Flags Summary</div>
  <div class="table-wrapper">
    <table>
      <caption class="sr-only">All flags in the dependency tree with roles, environments, and metadata</caption>
      <thead><tr><th>Flag Key</th><th>Role</th><th>Test</th><th>Prod</th><th>Team</th><th>Expiry</th><th>Created</th></tr></thead>
      <tbody id="summary-tbody"></tbody>
    </table>
  </div>
</div>

<div class="section">
  <div class="section-title">Observations</div>
  <div class="obs-grid" id="obs-grid"></div>
</div>

</main>
<footer class="footer" id="page-footer"><a href="https://armada.sailpoint.com/shipmate/docs/index.html">Generated with Shipmate</a></footer>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script type="application/json" id="flag-data">{}</script>
<script>
function envSpan(on){return '<span aria-hidden="true">'+(on?'✅':'❌')+'</span><span class="sr-only">'+(on?'ON':'OFF')+'</span>';}
let DATA;
try{
  DATA=JSON.parse(document.getElementById('flag-data').textContent);
}catch(e){
  document.body.innerHTML='<div style="padding:40px;font-family:system-ui,sans-serif;color:#EF4444"><h2>Invalid flag tree JSON</h2><p>Ensure <code>#flag-data</code> contains valid JSON (feature-flag-visualizer Flag Tree Data Object). '+String(e.message||e)+'</p></div>';
  throw e;
}

let isDark=window.matchMedia('(prefers-color-scheme: dark)').matches;
function applyTheme(){document.documentElement.setAttribute('data-theme',isDark?'dark':'light');const b=document.getElementById('theme-btn');b.textContent=isDark?'☀️':'🌙';b.setAttribute('aria-label',isDark?'Switch to light theme':'Switch to dark theme');buildDiagram();}
function toggleTheme(){isDark=!isDark;applyTheme();}

function buildStaticUI(){
  const r=DATA.root;
  document.title='Flag Tree: '+r.key;
  document.getElementById('hdr-key').textContent=r.key;
  const hb=document.getElementById('hdr-badges');
  hb.innerHTML=
    `<span class="badge">T ${envSpan(r.testOn)}</span>`+
    `<span class="badge">P ${envSpan(r.prodOn)}</span>`+
    (r.maintainerTeam?`<span class="badge badge-team">${r.maintainerTeam}</span>`:'')+
    (r.tags||[]).map(t=>`<span class="badge badge-tag">${t}</span>`).join('');
  const prodP=DATA.parents.filter(p=>!p.testOnly).length;
  const testP=DATA.parents.filter(p=>p.testOnly).length;
  document.getElementById('stats-row').innerHTML=
    `<div class="kpi-card"><div class="kpi-label">Total Flags</div><div class="kpi-value" data-target="${DATA.meta.totalFlags}">0</div></div>`+
    `<div class="kpi-card"><div class="kpi-label">Prod Prereqs</div><div class="kpi-value" data-target="${prodP}">0</div></div>`+
    `<div class="kpi-card"><div class="kpi-label">Test-only Prereqs</div><div class="kpi-value" data-target="${testP}">0</div></div>`+
    `<div class="kpi-card"><div class="kpi-label">Dependent Flags</div><div class="kpi-value" data-target="${DATA.children.length}">0</div></div>`+
    `<div class="kpi-card"><div class="kpi-label">Unowned</div><div class="kpi-value${DATA.meta.unownedCount?' warn':''}" data-target="${DATA.meta.unownedCount}">0</div></div>`+
    `<div class="kpi-card"><div class="kpi-label">Missing Expiry</div><div class="kpi-value${DATA.meta.missingExpiryCount?' warn':''}" data-target="${DATA.meta.missingExpiryCount}">0</div></div>`;
  document.getElementById('page-footer').innerHTML=
    `<a href="https://armada.sailpoint.com/shipmate/docs/index.html">Generated with Shipmate</a> &nbsp;·&nbsp; ${DATA.meta.generatedDate}`;
  buildObservations();
}

function buildObservations(){
  const obs=document.getElementById('obs-grid');
  const gc=DATA.grandchildren||[];
  const gp=DATA.grandparents||[];
  const allFlags=[DATA.root,...gp,...DATA.parents,...DATA.children,...gc];
  const prodOff=[...DATA.children,...gc].filter(f=>!f.prodOn);
  const unowned=allFlags.filter(f=>!f.maintainerTeam);
  const noExpiry=allFlags.filter(f=>!f.expiryTag);
  const testOnlyP=DATA.parents.filter(p=>p.testOnly);
  const prodOnlyC=DATA.children.filter(c=>c.prodOnly);
  const driftHtml=[
    ...testOnlyP.map(p=>`<li><b>${p.key}</b> — test prereq only, not in production</li>`),
    ...prodOnlyC.map(c=>`<li><b>${c.key}</b> — prod-only child (no test prereq)</li>`)
  ].join('');
  obs.innerHTML=
    `<div class="obs-card"><div class="obs-card-title">📊 Tree Summary</div><ul>`+
    `<li>${DATA.meta.totalFlags} total flags in tree</li>`+
    `<li>${DATA.parents.filter(p=>!p.testOnly).length} production prerequisites</li>`+
    `<li>${testOnlyP.length} test-only prerequisite${testOnlyP.length!==1?'s':''}</li>`+
    `<li>${DATA.children.length} dependent flags (children)</li>`+
    (gc.length?`<li>${gc.length} grandchildren</li>`:'')+
    (prodOff.length===0?'<li>All flags currently ON in prod &amp; test</li>':`<li style="color:var(--red)">${prodOff.length} flags OFF in production</li>`)+
    `</ul></div>`+
    `<div class="obs-card"><div class="obs-card-title">⚠ Hygiene Issues</div><ul>`+
    (noExpiry.length?`<li style="color:var(--red)"><b>${noExpiry.length}/${DATA.meta.totalFlags} flags missing expiry tags</b></li>`:'<li>All flags have expiry tags ✓</li>')+
    (unowned.length?`<li style="color:var(--orange)"><b>${unowned.length} unowned flag${unowned.length!==1?'s':''}</b></li>`:'<li>All flags have owners ✓</li>')+
    (unowned.length?`<li>${unowned.map(f=>`<span class="key-ref">${f.key}</span>`).join(', ')}</li>`:'')+
    `</ul></div>`+
    (driftHtml?`<div class="obs-card"><div class="obs-card-title">⚡ Environment Drift</div><ul>${driftHtml}</ul></div>`:'')+
    `<div class="obs-card"><div class="obs-card-title">✓ Cleanup Readiness</div><ul>`+
    (prodOff.length===0?'<li>All flags ON in both environments</li><li>No prod-OFF flags blocking cleanup</li>':`<li style="color:var(--red)">${prodOff.length} prod-OFF flags need enabling first</li>`)+
    `<li><b>Order:</b> Grandchildren → Children → Root → Parents</li>`+
    `<li>Wait 7-day prod bake after each merge</li>`+
    `</ul></div>`+
    `<div class="obs-card"><div class="obs-card-title">🎯 Next Actions</div><ul>`+
    (noExpiry.length?`<li>Add <code>expiration_month-*</code> tags to ${noExpiry.length} flag${noExpiry.length!==1?'s':''}</li>`:'')+
    (unowned.length?`<li>Assign maintainer to ${unowned.length} unowned flag${unowned.length!==1?'s':''} in LD</li>`:'')+
    (testOnlyP.length?`<li>Evaluate ${testOnlyP.length} test-only prereq${testOnlyP.length!==1?'s':''} for prod alignment</li>`:'')+
    (prodOnlyC.length?`<li>Evaluate ${prodOnlyC.length} prod-only child${prodOnlyC.length!==1?'ren':''} for test alignment</li>`:'')+
    `<li>Create cleanup Jira sub-tasks per flag layer</li>`+
    `</ul></div>`;
}

function animateKPIs(){document.querySelectorAll('[data-target]').forEach(el=>{const t=parseInt(el.dataset.target);let s=0;const inc=t/50;const iv=setInterval(()=>{s=Math.min(s+inc,t);el.textContent=Math.round(s);if(s>=t)clearInterval(iv);},16);});}

function buildTable(){
  const tb=document.getElementById('summary-tbody');
  function row(f,role,cls){
    const t=envSpan(f.testOn);
    const p=envSpan(f.prodOn);
    const exp=f.expiryTag||'<span style="color:var(--red)">— ⚠</span>';
    const team=f.maintainerTeam||'<span style="color:var(--red)">unowned ⚠</span>';
    tb.innerHTML+=`<tr><td class="table-key">${f.key}</td><td><span class="pill ${cls}">${role}</span></td><td>${t}</td><td>${p}</td><td style="font-size:11px">${team}</td><td>${exp}</td><td style="font-family:var(--mono);font-size:11px">${f.createdDate||'—'}</td></tr>`;
  }
  (DATA.grandparents||[]).forEach(g=>row(g,'Grandparent','pill-grandparent'));
  row(DATA.root,'Root','pill-root');
  DATA.parents.forEach(p=>row(p,p.testOnly?'Parent (test-only)':'Parent',p.testOnly?'pill-test-only':'pill-parent'));
  DATA.children.forEach(c=>row(c,c.prodOnly?'Child (prod-only)':'Child','pill-child'));
  (DATA.grandchildren||[]).forEach(g=>row(g,'Grandchild','pill-grandchild'));
}

const FONT="'Atkinson Hyperlegible Mono',monospace";
const CHW=5.8,FNTSZ=9.5,NODE_H=58,DOT_R=5,ROOT_R=40,PAD=48;

function splitKey(k){const mid=k.length/2;const idxs=[];for(let i=0;i<k.length;i++)if(k[i]==='_')idxs.push(i);if(!idxs.length)return[k,''];const best=idxs.reduce((a,b)=>Math.abs(a-mid)<=Math.abs(b-mid)?a:b);return[k.slice(0,best),k.slice(best+1)];}
function nW(k){const[l1,l2]=splitKey(k);return Math.max(130,Math.max(l1.length,l2.length)*CHW+32);}
function rowStep(keys,gap=22){return keys.length?Math.max(...keys.map(k=>nW(k)))+gap:0;}

let svgZoom,svgSel;

function C(){
  const d=isDark;
  return{
    pFill:d?'#1E3A5F':'#DBEAFE',pStroke:d?'#3B82F6':'#2563EB',pText:d?'#93C5FD':'#1E3A8A',
    toFill:d?'#1E1B4B':'#EEF2FF',toStroke:d?'#6366F1':'#4338CA',toText:d?'#A5B4FC':'#3730A3',
    rFill:d?'#451A03':'#FEF3C7',rStroke:d?'#F59E0B':'#D97706',rText:d?'#FDE68A':'#78350F',rGlow:d?'rgba(245,158,11,.25)':'rgba(245,158,11,.18)',
    gpFill:d?'#2E1065':'#F5F3FF',gpStroke:d?'#A78BFA':'#7C3AED',gpText:d?'#DDD6FE':'#4C1D95',
    cFill:d?'#022C22':'#D1FAE5',cStroke:d?'#10B981':'#059669',cText:d?'#6EE7B7':'#065F46',
    gcFill:d?'#022C22':'#ECFDF5',gcStroke:d?'#34D399':'#6EE7B7',gcText:d?'#A7F3D0':'#065F46',
    eProd:d?'#4B5563':'#9CA3AF',eTest:d?'#6D28D9':'#A5B4FC',eGp:d?'#7C3AED':'#A78BFA',
    bg:d?'#1A1D27':'#F8FAFC',ll:d?'#334155':'#CBD5E1',
    on:'#22C55E',off:'#EF4444',
    tip:d?'#0F1117':'#1E293B',tipTx:'#F8FAFC'
  };
}

function buildDiagram(){
  const wrap=document.getElementById('diagram-svg-wrapper');
  const contW=Math.max(wrap.clientWidth||1200,1200);
  const col=C();
  const gp=DATA.grandparents||[];
  const hasGP=gp.length>0;
  const pKeys=DATA.parents.map(p=>p.key);
  const cKeys=DATA.children.map(c=>c.key);
  const gc=DATA.grandchildren||[];
  const gcKeys=gc.map(g=>g.key);
  const gpKeys=gp.map(g=>g.key);
  const gpStep=rowStep(gpKeys,18);
  const pStep=rowStep(pKeys,18);
  const cStep=rowStep(cKeys,18);
  const gcStep=rowStep(gcKeys,12);
  const pRow1=DATA.parents.slice(0,7);
  const pRow2=DATA.parents.slice(7);
  function rSpan(keys,step){return keys.length?(keys.length-1)*step+nW(keys[keys.length-1]):0;}
  const gcByParent={};
  gc.forEach(g=>{if(!gcByParent[g.parentKey])gcByParent[g.parentKey]=[];gcByParent[g.parentKey].push(g);});
  const gpByParent={};
  gp.forEach(g=>{if(!gpByParent[g.parentKey])gpByParent[g.parentKey]=[];gpByParent[g.parentKey].push(g);});
  let maxGcSpan=0;
  DATA.children.forEach(c=>{const gs=gcByParent[c.key]||[];if(gs.length){maxGcSpan=Math.max(maxGcSpan,rSpan(gs.map(g=>g.key),gcStep));}});
  const svgW=Math.max(contW,1200,
    rSpan(gpKeys,gpStep)+160,
    rSpan(pRow1.map(p=>p.key),pStep)+160,
    rSpan(pRow2.map(p=>p.key),pStep)+160,
    rSpan(cKeys,cStep)+160,
    maxGcSpan+160);
  const hasGC=gc.length>0;
  const gpRowH=hasGP?NODE_H+24:0;
  const Y0=PAD;
  const Y1a=PAD+gpRowH,Y1b=Y1a+NODE_H+24,Y2=Y1b+NODE_H+90,Y3=Y2+ROOT_R*2+90,Y4=Y3+NODE_H+80;
  const svgH=(hasGC?Y4+NODE_H:Y3+NODE_H)+PAD+60;
  const svg=d3.select('#diagram-svg');
  svg.selectAll('*').remove();
  svg.attr('width',svgW).attr('height',svgH).style('background',col.bg);
  const defs=svg.append('defs');
  const filt=defs.append('filter').attr('id','glow');
  filt.append('feGaussianBlur').attr('stdDeviation','5').attr('result','blur');
  const fm=filt.append('feMerge');
  fm.append('feMergeNode').attr('in','blur');
  fm.append('feMergeNode').attr('in','SourceGraphic');
  const g=svg.append('g').attr('id','mg');
  svgZoom=d3.zoom().scaleExtent([0.15,3]).on('zoom',e=>g.attr('transform',e.transform));
  svg.call(svgZoom);
  svgSel=svg;
  const tip=d3.select('body').selectAll('#d3tip').data([1]).join('div').attr('id','d3tip')
    .style('position','fixed').style('pointer-events','none').style('opacity','0')
    .style('background',col.tip).style('color',col.tipTx).style('padding','10px 14px')
    .style('border-radius','8px').style('font-family',FONT).style('font-size','11px')
    .style('max-width','320px').style('z-index','9999').style('box-shadow','0 4px 16px rgba(0,0,0,.35)')
    .style('line-height','1.7').style('transition','opacity .1s');
  function att(sel,f){
    sel.on('mousemove',ev=>{
      const w=[];if(!f.maintainerTeam)w.push('⚠ unowned');if(!f.expiryTag)w.push('⚠ no expiry');if(f.testOnly)w.push('test-only prereq');if(f.prodOnly)w.push('prod-only child');
      tip.html(`<b>${f.key}</b><br>Team: ${f.maintainerTeam||'<i>unowned</i>'}<br>Created: ${f.createdDate||'—'}<br>Test ${f.testOn?'✅':'❌'} &nbsp; Prod ${f.prodOn?'✅':'❌'}${w.length?'<br><span style="color:#FCA5A5">'+w.join(' · ')+'</span>':''}`)
        .style('opacity','1').style('left',(ev.clientX+16)+'px').style('top',(ev.clientY-8)+'px');
    }).on('mouseleave',()=>tip.style('opacity','0'));
  }
  function dn(cx,y,f,opts){
    const[l1,l2]=splitKey(f.key);const w=nW(f.key);const h=NODE_H;
    const ng=g.append('g').style('cursor','pointer');
    ng.append('rect').attr('x',cx-w/2).attr('y',y).attr('width',w).attr('height',h).attr('rx',7)
      .attr('fill',opts.fill).attr('stroke',opts.stroke).attr('stroke-width',opts.sw||1.5).attr('stroke-dasharray',opts.sd||null);
    ng.append('text').attr('x',cx).attr('y',y+14).attr('text-anchor','middle').attr('dominant-baseline','middle')
      .attr('font-family',FONT).attr('font-size',FNTSZ).attr('font-weight',700).attr('fill',opts.tx).text(l1);
    if(l2)ng.append('text').attr('x',cx).attr('y',y+27).attr('text-anchor','middle').attr('dominant-baseline','middle')
      .attr('font-family',FONT).attr('font-size',FNTSZ-.5).attr('font-weight',700).attr('fill',opts.tx).text(l2);
    const dy=y+h-11;
    [['Test',f.testOn,cx-3,'end'],['Prod',f.prodOn,cx+3,'start']].forEach(([lbl,on,ex,anchor])=>{
      ng.append('text').attr('x',ex).attr('y',dy).attr('text-anchor',anchor).attr('dominant-baseline','middle').attr('font-size',7.5).attr('fill',opts.tx).attr('opacity',.9).text(`${lbl} ${on?'✅':'❌'}`);
    });
    if(opts.badge){ng.append('rect').attr('x',cx-30).attr('y',y-14).attr('width',60).attr('height',13).attr('rx',6).attr('fill',opts.badge.bg);ng.append('text').attr('x',cx).attr('y',y-7).attr('text-anchor','middle').attr('font-size',7).attr('fill','#fff').attr('font-weight',700).text(opts.badge.lbl);}
    att(ng,f);
    return{cx,bot:y+h,top:y};
  }
  function edge(x1,y1,x2,y2,stroke,dash){
    const my=(y1+y2)/2;
    g.append('path').attr('d',`M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`)
      .attr('fill','none').attr('stroke',stroke).attr('stroke-width',1.5).attr('stroke-dasharray',dash||null).attr('opacity',.5);
  }
  function layerLbl(y,txt){
    g.append('text').attr('x',10).attr('y',y+NODE_H/2).attr('text-anchor','middle').attr('dominant-baseline','middle')
      .attr('font-family',FONT).attr('font-size',8.5).attr('fill',col.ll).attr('writing-mode','vertical-rl')
      .attr('transform',`rotate(-180,10,${y+NODE_H/2})`).text(txt);
  }
  if(hasGP)layerLbl(Y0,'▲▲ GRANDPARENTS');
  if(DATA.parents.length)layerLbl(Y1a,'▲ PREREQUISITES');
  if(DATA.children.length)layerLbl(Y3,'▼ DEPENDENTS');
  if(hasGC)layerLbl(Y4,'▼▼ GRANDCHILDREN');
  const mid=svgW/2;
  function rowXs(arr,step){const n=arr.length;if(n===0)return[];if(n===1)return[mid];const tw=(n-1)*step;return arr.map((_,i)=>mid-tw/2+i*step);}
  // Render grandparents
  const gpxs=rowXs(gp,gpStep);
  const gpnodes={};
  gp.forEach((g,i)=>{gpnodes[g.key]=dn(gpxs[i],Y0,g,{fill:col.gpFill,stroke:col.gpStroke,tx:col.gpText});});
  const p1xs=rowXs(pRow1,pStep),p2xs=rowXs(pRow2,pStep);
  const pnodes={};
  pRow1.forEach((p,i)=>{
    const to=p.testOnly;
    const opts=to?{fill:col.toFill,stroke:col.toStroke,tx:col.toText,sd:'5,3',badge:{bg:col.toStroke,lbl:'test-only'}}:{fill:col.pFill,stroke:col.pStroke,tx:col.pText};
    pnodes[p.key]=dn(p1xs[i],Y1a,p,opts);
  });
  pRow2.forEach((p,i)=>{
    const to=p.testOnly;
    const opts=to?{fill:col.toFill,stroke:col.toStroke,tx:col.toText,sd:'5,3',badge:{bg:col.toStroke,lbl:'test-only'}}:{fill:col.pFill,stroke:col.pStroke,tx:col.pText};
    pnodes[p.key]=dn(p2xs[i],Y1b,p,opts);
  });
  const rg=g.append('g').style('cursor','default');
  rg.append('circle').attr('cx',mid).attr('cy',Y2+ROOT_R).attr('r',ROOT_R+10).attr('fill',col.rGlow).attr('filter','url(#glow)');
  rg.append('circle').attr('cx',mid).attr('cy',Y2+ROOT_R).attr('r',ROOT_R).attr('fill',col.rFill).attr('stroke',col.rStroke).attr('stroke-width',2.5);
  const[rl1,rl2]=splitKey(DATA.root.key);
  rg.append('text').attr('x',mid).attr('y',Y2+ROOT_R-8).attr('text-anchor','middle').attr('dominant-baseline','middle').attr('font-family',FONT).attr('font-size',9.5).attr('font-weight',700).attr('fill',col.rText).text(rl1);
  rg.append('text').attr('x',mid).attr('y',Y2+ROOT_R+6).attr('text-anchor','middle').attr('dominant-baseline','middle').attr('font-family',FONT).attr('font-size',9).attr('font-weight',700).attr('fill',col.rText).text(rl2);
  [['Test',DATA.root.testOn,mid-2,'end'],['Prod',DATA.root.prodOn,mid+2,'start']].forEach(([lbl,on,ex,anchor])=>{
    rg.append('text').attr('x',ex).attr('y',Y2+ROOT_R+22).attr('text-anchor',anchor).attr('dominant-baseline','middle').attr('font-size',7).attr('fill',col.rText).attr('opacity',.9).text(`${lbl} ${on?'✅':'❌'}`);
  });
  att(rg,DATA.root);
  // Edges: grandparents → their child parent
  gp.forEach(g=>{const gpn=gpnodes[g.key];const pn=pnodes[g.parentKey];if(gpn&&pn)edge(gpn.cx,gpn.bot,pn.cx,pn.top,col.eGp,'3,3');});
  DATA.parents.forEach(p=>{const nd=pnodes[p.key];if(!nd)return;edge(nd.cx,nd.bot,mid,Y2-8,p.testOnly?col.eTest:col.eProd,p.testOnly?'4,3':null);});
  const c3xs=rowXs(DATA.children,cStep);
  const cnodes={};
  DATA.children.forEach((c,i)=>{
    const opts={fill:col.cFill,stroke:col.cStroke,tx:col.cText,sd:c.prodOnly?'5,3':null};
    if(c.prodOnly)opts.badge={bg:col.cStroke,lbl:'prod-only'};
    const nd=dn(c3xs[i],Y3,c,opts);
    cnodes[c.key]=nd;
    edge(mid,Y2+ROOT_R*2,nd.cx,Y3,col.eProd);
  });
  DATA.children.forEach((c,ci)=>{
    const gcs=gcByParent[c.key]||[];if(!gcs.length)return;
    const pcx=c3xs[ci];
    const gcxs=gcs.length===1?[pcx]:gcs.map((_,i)=>pcx-(gcs.length-1)*gcStep/2+i*gcStep);
    gcs.forEach((gc,gi)=>{
      const nd=dn(gcxs[gi],Y4,gc,{fill:col.gcFill,stroke:col.gcStroke,tx:col.gcText});
      if(cnodes[c.key])edge(cnodes[c.key].cx,cnodes[c.key].bot,nd.cx,Y4,col.eProd);
    });
  });
  g.append('text').attr('x',10).attr('y',Y2+ROOT_R).attr('text-anchor','middle').attr('dominant-baseline','middle')
    .attr('font-family',FONT).attr('font-size',8.5).attr('fill',col.ll).attr('writing-mode','vertical-rl')
    .attr('transform',`rotate(-180,10,${Y2+ROOT_R})`).text('★ ROOT FLAG');
  document.getElementById('diagram-legend').innerHTML=
    (gp.length?`<div class="legend-item"><div class="legend-rect" style="background:${col.gpFill};border:2px solid ${col.gpStroke}"></div>Grandparent</div>`:'')+
    `<div class="legend-item"><div class="legend-circle" style="background:${col.rFill};border:2px solid ${col.rStroke}"></div>Root flag</div>`+
    `<div class="legend-item"><div class="legend-rect" style="background:${col.pFill};border:2px solid ${col.pStroke}"></div>Prod prerequisite</div>`+
    `<div class="legend-item"><div class="legend-rect" style="background:${col.toFill};border:2px dashed ${col.toStroke}"></div>Test-only prerequisite</div>`+
    `<div class="legend-item"><div class="legend-rect" style="background:${col.cFill};border:2px solid ${col.cStroke}"></div>Dependent (child)</div>`+
    (gc.length?`<div class="legend-item"><div class="legend-rect" style="background:${col.gcFill};border:2px solid ${col.gcStroke}"></div>Grandchild</div>`:'')+
    `<div class="legend-item"><div style="width:20px;height:2px;background:${col.eProd};opacity:.7;margin-top:6px"></div>Prod edge</div>`+
    `<div class="legend-item"><div style="width:20px;height:0;border-top:2px dashed ${col.eTest};opacity:.8;margin-top:6px"></div>Test-only edge</div>`+
    (gp.length?`<div class="legend-item"><div style="width:20px;height:0;border-top:2px dashed ${col.eGp};opacity:.8;margin-top:6px"></div>Grandparent edge</div>`:'')+'';
}

function zoomIn(){if(svgSel&&svgZoom)svgSel.transition().call(svgZoom.scaleBy,1.3);}
function zoomOut(){if(svgSel&&svgZoom)svgSel.transition().call(svgZoom.scaleBy,0.77);}
function resetZoom(){if(svgSel&&svgZoom)svgSel.transition().call(svgZoom.transform,d3.zoomIdentity);}

window.addEventListener('load',()=>{
  try{
    if(!DATA||!DATA.root||!DATA.root.key){
      document.body.innerHTML='<div style="padding:40px;font-family:system-ui,sans-serif;color:#EF4444"><h2>Invalid Flag Tree Data</h2><p>The DATA object must include <code>root.key</code>. Ensure JSON matches the Flag Tree Data Object schema.</p></div>';
      return;
    }
    buildStaticUI();animateKPIs();buildTable();applyTheme();
  }catch(e){
    console.error('Flag tree render error:',e);
    document.body.innerHTML='<div style="padding:40px;font-family:system-ui,sans-serif;color:#EF4444"><h2>Render error</h2><pre style="white-space:pre-wrap">'+String(e.message||e)+'</pre></div>';
  }
});
let resizeTimer;
window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(buildDiagram,250);});
</script>
</body>
