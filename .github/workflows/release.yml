name: Release

# Publishes on GitHub Release via npm OIDC trusted publishing.
# `workflow_dispatch` is retained for manual/dry-run testing.
on:
  release:
    # `published` covers both brand-new releases and drafts being published.
    # A release left as a draft does not trigger anything.
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without a leading v (e.g. 0.0.1)'
        required: true
        type: string
      dry_run:
        description: 'Pack and validate without publishing'
        required: false
        type: boolean
        default: true
      create_release:
        description: 'Also tag the commit and create a GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      contents: write   # tag the commit + create the GitHub Release (dispatch only)
      id-token: write   # OIDC token for npm trusted publishing

    steps:
      # On a release event GITHUB_SHA is the commit the release targets,
      # so the default checkout is already the right tree.
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve version
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "release" ]]; then
            RAW="$RELEASE_TAG"
          else
            RAW="$INPUT_VERSION"
          fi

          VERSION="${RAW#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$RAW' is not a valid semver version"
            exit 1
          fi

          # Never let a prerelease take over the `latest` dist-tag. A release
          # flagged pre-release in the GitHub UI is honoured too, even if its
          # version string looks stable.
          if [[ "$VERSION" == *-* || "$RELEASE_PRERELEASE" == "true" ]]; then
            NPM_TAG=next
            PRERELEASE=true
          else
            NPM_TAG=latest
            PRERELEASE=false
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$NPM_TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Summarize
        run: |
          {
            echo "### Release ${{ steps.meta.outputs.version }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| trigger | \`${{ github.event_name }}\` |"
            echo "| dist-tag | \`${{ steps.meta.outputs.npm_tag }}\` |"
            echo "| prerelease | \`${{ steps.meta.outputs.prerelease }}\` |"
            echo "| dry run | \`${{ inputs.dry_run == true }}\` |"
            echo "| commit | \`${{ github.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Type check
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      # package.json is committed as 0.0.0; the release tag (or input) is the
      # source of truth for the published version.
      - name: Set package version
        run: pnpm pkg set version="${{ steps.meta.outputs.version }}"

      # `files: ["dist"]` and there is no prepack hook, so this must be explicit
      # or the tarball ships no code.
      - name: Build
        run: pnpm run build

      - name: Verify tarball contents
        run: |
          set -euo pipefail
          pnpm pack --pack-destination "$RUNNER_TEMP"
          echo "--- tarball contents ---"
          tar -tzf "$RUNNER_TEMP"/*.tgz

      # --no-git-checks is required: `pnpm pkg set version` dirties the tree,
      # which pnpm otherwise refuses to publish from.
      - name: Publish to npm (dry run)
        if: ${{ inputs.dry_run == true }}
        run: pnpm publish --dry-run --no-git-checks --tag "${{ steps.meta.outputs.npm_tag }}"
        env:
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Publish to npm
        if: ${{ inputs.dry_run != true }}
        run: pnpm publish --no-git-checks --tag "${{ steps.meta.outputs.npm_tag }}"
        env:
          NPM_CONFIG_PROVENANCE: 'true'

      # Only for manual runs — on a release event the release already exists.
      # Releases created here use GITHUB_TOKEN, which by design does not
      # re-trigger this workflow, so there is no publish loop.
      - name: Create GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run != true && inputs.create_release }}
        run: |
          set -euo pipefail
          gh release create "v${{ steps.meta.outputs.version }}" \
            --target "$GITHUB_SHA" \
            --title "v${{ steps.meta.outputs.version }}" \
            --generate-notes \
            ${{ steps.meta.outputs.prerelease == 'true' && '--prerelease' || '--latest' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
